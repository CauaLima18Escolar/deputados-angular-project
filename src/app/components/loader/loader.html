<div
  class="flex items-center justify-center gap-2"
  [class.fixed]="fullscreen"
  [class.inset-0]="fullscreen"
  [class.z-50]="fullscreen"
  [class.bg-white/80]="fullscreen"
  [class.backdrop-blur-sm]="fullscreen"
>
  <span
    class="block animate-spin rounded-full border border-zinc-200 border-t-zinc-600"
    [ngClass]="{
      'h-3.5 w-3.5': size === 'sm',
      'h-4 w-4': size === 'md',
      'h-5 w-5': size === 'lg'
    }"
    aria-hidden="true"
  ></span>

  @if (text) {
    <span class="text-xs font-medium text-zinc-500">
      {{ text }}
    </span>
  }
</div>
