<main class="p-4">
    <header>
        <h3 class="text-xl text-center font-bold mb-4">Listagem dos Deputados</h3>

        <fieldset class="grid grid-cols-[1fr_auto] items-center mb-4">
            <input #searchInput class="text-sm px-3 py-2 border border-neutral-300 border-r-0 rounded-l-md w-full
               bg-white text-neutral-700 placeholder:text-neutral-400
               outline-none transition-all duration-200
               focus:border-neutral-500 focus:ring-1 focus:ring-neutral-300" placeholder="Buscar por nome ou ID..."
                type="text">

            <button (click)="buscarPorId(searchInput.value)" class="h-full px-5 py-2 text-sm font-semibold
               border border-neutral-300 rounded-r-md
               bg-neutral-100 text-neutral-700
               hover:bg-neutral-800 hover:text-white hover:border-neutral-800
               active:bg-neutral-700
               transition-all duration-200 cursor-pointer" type="button">
                Pesquisar
            </button>
        </fieldset>
    </header>

    <section class="grid grid-cols-8 gap-4">
    @for (dep of deputados(); track dep.id) {
        <div
            class="group relative overflow-hidden rounded-xl border border-neutral-200 bg-white p-3 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-indigo-200 hover:shadow-lg"
        >
            <div class="relative flex h-32 justify-center overflow-hidden rounded-lg bg-neutral-100">
                <img
                    [src]="dep.urlFoto"
                    alt="Foto do deputado"
                    class="h-32 object-cover transition-transform duration-300 group-hover:scale-105"
                >

                <span
                    class="absolute right-0 top-3 rounded-l-md bg-indigo-600 px-3 py-1.5 text-xs font-bold text-white shadow-sm"
                >
                    {{ dep.siglaPartido.slice(0, 4) }}
                </span>
            </div>

            <div class="pt-3">
                <p class="text-center text-sm font-bold text-neutral-800">
                    {{ dep.nome }}
                </p>

                <div class="mt-2 flex items-center justify-center gap-1">
                    <span class="text-xs font-medium text-neutral-400">ID</span>
                    <span class="text-xs font-semibold text-indigo-600">
                        {{ dep.id }}
                    </span>
                </div>
            </div>

            <div
                class="absolute bottom-0 left-0 h-0.5 w-0 bg-indigo-600 transition-all duration-300 group-hover:w-full"
            ></div>
        </div>
    }
</section>
</main>
