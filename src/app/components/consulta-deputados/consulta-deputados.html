<main class="p-4">
    <header class="sticky top-0 z-100 bg-white">
        <h3 class="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-8">
            <span class="inline-flex items-center gap-3">
                <span class="w-10 h-1 bg-blue-600 rounded-full"></span>
                Listagem dos Deputados
                <span class="w-10 h-1 bg-blue-600 rounded-full"></span>
            </span>
        </h3>

        <fieldset class="grid grid-cols-[1fr_auto] items-center mb-4">
            <input #searchInput class="text-sm px-3 py-2 border border-neutral-300 border-r-0 rounded-l-md w-full
               bg-white text-neutral-700 placeholder:text-neutral-400
               outline-none transition-all duration-200
               focus:border-neutral-500 focus:ring-1 focus:ring-neutral-300" placeholder="Buscar por nome ou ID..."
                type="text">

            <button (click)="searchByName(searchInput.value)" class="h-full px-5 py-2 text-sm font-semibold
               border border-neutral-300 rounded-r-md
               bg-neutral-100 text-neutral-700
               hover:bg-neutral-800 hover:text-white hover:border-neutral-800
               active:bg-neutral-700
               transition-all duration-200 cursor-pointer" type="button">
                Pesquisar
            </button>
        </fieldset>
    </header>


    @if (isLoading()) {
        <div class="p-4"><app-loader [size]="'lg'"/></div>
    } @else if (deputados().length == 0) {
        <h3 class="font-medium text-gray-400 text-center p-8">Não foi possível encontrar nenhum deputado(a)</h3>
    } @else {
        <section class="grid grid-cols-8 gap-4">
            @for (dep of deputados(); track dep.id) {
            <div
                class="group relative overflow-hidden rounded-xl border border-neutral-200 bg-white p-3 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-indigo-200 hover:shadow-lg">
                <div class="relative flex h-32 justify-center overflow-hidden rounded-lg bg-neutral-100">
                    <img [src]="dep.urlFoto" alt="Foto do deputado"
                        class="h-32 object-cover transition-transform duration-300 group-hover:scale-105">
    
                    <span
                        class="absolute right-0 top-3 rounded-l-md bg-indigo-600 px-3 py-1.5 text-xs font-bold text-white shadow-sm">
                        {{ dep.siglaPartido.slice(0, 4) }}
                    </span>
                </div>
    
                <div class="pt-3">
                    <p class="text-center text-sm font-bold text-neutral-800">
                        {{ dep.nome }}
                    </p>
    
                    <div class="mt-2 flex items-center justify-center gap-1">
                        <span class="text-xs font-medium text-neutral-400">ID</span>
                        <span class="text-xs font-semibold text-indigo-600">
                            {{ dep.id }}
                        </span>
                    </div>
                </div>
    
                <div
                    class="absolute bottom-0 left-0 h-0.5 w-0 bg-indigo-600 transition-all duration-300 group-hover:w-full">
                </div>
            </div>
            }
        </section>
    }


    <nav class="flex items-center justify-center gap-3 py-4" aria-label="Paginação">
        <button type="button" [disabled]="currentPage() == 1 || isLoading()" (click)="previusPage()"
            class="cursor-pointer inline-flex h-9 items-center gap-1.5 rounded-md border border-zinc-200 bg-white px-3 text-sm font-medium text-zinc-700 shadow-sm transition-colors hover:bg-zinc-50 hover:text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-40">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
                <path fill-rule="evenodd"
                    d="M12.79 15.77a.75.75 0 0 1-1.06.02l-5.25-5a.75.75 0 0 1 0-1.08l5.25-5a.75.75 0 1 1 1.04 1.08L8.07 10.25l4.72 4.48a.75.75 0 0 1 0 1.04Z"
                    clip-rule="evenodd" />
            </svg>

            Anterior
        </button>

        <span class="min-w-[110px] text-center text-sm text-zinc-500">
            Página <span class="font-medium text-zinc-900">{{currentPage()}}</span>
        </span>

        <button type="button" [disabled]="(deputados().length < 24) || isLoading()" (click)="nextPage()"
            class="cursor-pointer inline-flex h-9 items-center gap-1.5 rounded-md border border-zinc-200 bg-white px-3 text-sm font-medium text-zinc-700 shadow-sm transition-colors hover:bg-zinc-50 hover:text-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-40">
            Próxima

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
                <path fill-rule="evenodd"
                    d="M7.21 4.23a.75.75 0 0 1 1.06-.02l5.25 5a.75.75 0 0 1 0 1.08l-5.25 5a.75.75 0 1 1-1.04-1.08l4.7-4.48-4.72-4.48a.75.75 0 0 1 0-1.04Z"
                    clip-rule="evenodd" />
            </svg>
        </button>
    </nav>
</main>
